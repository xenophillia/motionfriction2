<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="./motion-favi.png" type="image/png" />
  <meta property="og:title" content="this spectacle is under construction" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./open-graph.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="./open-graph.png" />
  <title>this spectacle is under construction</title>
  <style>
    :root {
      --bg: #000;
      --fg: #f6f3ef;
      --accent: #fbbf24;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Georgia", "Times New Roman", serif;
      overflow-x: hidden;
      overflow-y: scroll;
      text-transform: lowercase;
    }
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bg img {
      height: 100%;
      width: auto;
      object-fit: contain;
      display: block;
      opacity: 0;
      transition: opacity 240ms ease;
    }
    body.video-left .bg {
      justify-content: flex-start;
    }
    body.video-right .bg {
      justify-content: flex-end;
    }
    body.is-active .bg img {
      opacity: 1;
    }
    body.is-audio .bg img {
      display: none;
    }
    .audio-gradient {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: var(--audio-grad-width, 0%);
      background: linear-gradient(90deg, var(--audio-grad-color, transparent) 0%, rgba(0, 0, 0, 0) 100%);
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: width 40ms linear;
    }
    body.has-gradient .audio-gradient {
      opacity: 1;
    }
    .wrap {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 200ms ease;
    }
    body.is-active .ui {
      opacity: 1;
    }
    .ui-left {
      position: absolute;
      left: 24px;
      bottom: 24px;
      pointer-events: none;
    }
    .ui-right {
      position: absolute;
      right: 24px;
      bottom: 24px;
      display: flex;
      gap: 10px;
      align-items: center;
      pointer-events: none;
    }
    .speed-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 140px;
      height: 24px;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 4;
      pointer-events: auto;
    }
    body.show-speed-toggle .speed-toggle {
      display: flex;
    }
    .speed-track {
      position: relative;
      width: 100%;
      height: 2px;
      background: rgba(246, 243, 239, 0.8);
    }
    .speed-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #f6f3ef;
    }
    .speed-range {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .controls {
      pointer-events: auto;
      margin-top: 1rem;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      margin: 0 0 0.5rem 0;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0.25rem 0;
      font-size: clamp(1rem, 2vw, 1.25rem);
    }
    .meter {
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.3rem, 3.5vw, 2.1rem);
      font-family: "Helvetica Neue", "Arial", sans-serif;
      letter-spacing: 0.02em;
      color: #f6f3ef;
      border-radius: 999px;
      padding: 0;
    }
    body.is-video .meter {
      display: none;
    }
    .scroll-space {
      height: 30000px;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,0.06), transparent);
    }
    .hint {
      color: #5a5a5a;
    }
    .accent {
      color: var(--accent);
    }
    .start-screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 3;
      background: #000;
      padding: 24px;
    }
    .start-panel {
      display: grid;
      gap: 0;
      text-align: center;
    }
    .start-item {
      appearance: none;
      border: none;
      background: none;
      color: #f8f8f8;
      font-size: clamp(1.3rem, 3.5vw, 2.1rem);
      font-family: "Helvetica Neue", "Arial", sans-serif;
      letter-spacing: 0.02em;
      cursor: default;
      pointer-events: none;
      padding: 8px 18px;
      transition: none;
    }
    .mode-label {
      font-size: clamp(1.3rem, 3.5vw, 2.1rem);
      font-family: "Helvetica Neue", "Arial", sans-serif;
      letter-spacing: 0.02em;
      color: #f6f3ef;
    }
    .start-item.is-selected {
      color: #000;
      background-color: var(--item-color, #fff);
      background-image: var(--item-bg-image, none);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .tiny-title {
      position: fixed;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      font-family: "Helvetica Neue", "Arial", sans-serif;
      font-size: clamp(0.65rem, 1.8vw, 1.05rem);
      letter-spacing: 0.02em;
      color: #f6f3ef;
      z-index: 4;
      pointer-events: none;
      text-transform: lowercase;
    }
    .distance-counter {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      font-family: "Helvetica Neue", "Arial", sans-serif;
      font-size: clamp(0.65rem, 1.8vw, 1.05rem);
      letter-spacing: 0.02em;
      color: #f6f3ef;
      z-index: 4;
      pointer-events: none;
      text-transform: lowercase;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="bg">
    <img id="bg-frame" alt="Background video frame" />
  </div>
  <div class="audio-gradient" id="audio-gradient"></div>
  <div class="start-screen" id="start-screen">
    <div class="start-panel" id="start-panel">
    </div>
  </div>
  <div class="wrap"></div>
  <div class="ui">
    <div class="ui-left">
      <div class="meter">
        <span id="speed">0.00</span>
      </div>
    </div>
    <div class="ui-right">
      <div class="mode-label" id="mode-label"></div>
    </div>
  </div>
  <div class="scroll-space"></div>
  <div class="tiny-title">this spectacle is under construction</div>
  <div class="distance-counter" id="distance-counter">i sat through 0px, 0in and 0m</div>
  <div class="speed-toggle" id="speed-toggle" aria-hidden="true">
    <div class="speed-track">
      <div class="speed-thumb" id="speed-thumb"></div>
    </div>
    <input class="speed-range" id="speed-range" type="range" min="0.1" max="1.5" step="0.05" value="0.6" />
  </div>

  <script>
    const FRAME_PREFIX = "frame_";
    const FRAME_EXT = "jpg";
    const FRAME_PAD = 6;
    const VIDEO_SOURCES = {
      default: { dir: "./video", frames: 750 },
      bw: { dir: "./video-1", frames: 900 },
      color: { dir: "./video-2", frames: 900 }
    };

    const frameEl = document.getElementById("bg-frame");
    const bgEl = document.querySelector(".bg");
    const audioGradientEl = document.getElementById("audio-gradient");
    const scrollSpace = document.querySelector(".scroll-space");
    const speedEl = document.getElementById("speed");
    const modeLabel = document.getElementById("mode-label");
    const distanceEl = document.getElementById("distance-counter");
    const speedToggle = document.getElementById("speed-toggle");
    const speedRange = document.getElementById("speed-range");
    const speedThumb = document.getElementById("speed-thumb");
    const startScreen = document.getElementById("start-screen");
    const startPanel = document.getElementById("start-panel");

    const TRACK_DIR = "./tracks";
    const CLICK_URL = "./click.wav";
    const TRACKS = [
      { label: "Jazz2 Soft Guitar", file: "Dance and Tech 1-Jazz2 Soft Guitar.wav" },
      { label: "Feat Pete Kit", file: "Dance and Tech 2-Feat Pete Kit.wav" },
      { label: "Selector Kit Clean", file: "Dance and Tech 3-Selector Kit Clean.wav" },
      { label: "Flares Kit", file: "Dance and Tech 4-Flares Kit.wav" },
      { label: "Banjorific", file: "Dance and Tech 5-Banjorific.wav" },
      { label: "Soft Horns Brass", file: "Dance and Tech 6-Soft Horns Brass.wav" },
      { label: "House Bass", file: "Dance and Tech 7-House Bass.wav" },
      { label: "Fat Bass Wobble", file: "Dance and Tech 8-Fat Bass Wobble.wav" }
    ];
    const TRACK_COLORS = {
      "Jazz2 Soft Guitar": "Peru",
      "Feat Pete Kit": "SlateBlue",
      "Selector Kit Clean": "MediumAquaMarine",
      "Flares Kit": "Tomato",
      "Banjorific": "DeepPink",
      "Soft Horns Brass": "Olive",
      "House Bass": "CornflowerBlue",
      "Fat Bass Wobble": "SpringGreen"
    };
    const CONTENT = [
      ...TRACKS.map((track) => ({
        id: track.file,
        label: track.label,
        type: "track",
        file: track.file,
        color: TRACK_COLORS[track.label]
      })),
      {
        id: "bw-dancer",
        label: "bw dancer",
        type: "video",
        source: VIDEO_SOURCES.bw,
        preview: "./video-1/frame_000001.jpg"
      },
      {
        id: "full-color-dancer",
        label: "full color dancer",
        type: "video",
        source: VIDEO_SOURCES.color,
        preview: "./video-2/frame_000001.jpg"
      }
    ];

    let lastY = window.scrollY;
    let lastT = performance.now();
    let lastScrollTime = lastT;
    let smoothedSpeed = 0;
    let direction = 1;
    let frameHead = 0;
    let totalScroll = 0;
    let currentFrame = -1;
    let lastGoodSrc = "";
    let currentTrack = TRACKS[0].file;
    let lastAudioUrl = "";
    let currentVideoDir = VIDEO_SOURCES.default.dir;
    let totalFrames = VIDEO_SOURCES.default.frames;
    let displayFrames = VIDEO_SOURCES.default.frames;
    let isActive = false;
    let activeMode = "none"; // "track" or "video"
    let nextTrackColor = "transparent";
    let audioGradProgress = 0;
    let totalDistancePx = 0;
    let speedMultiplier = 0.6;

    const IN_PER_PX = 1 / 96;
    const M_PER_IN = 0.0254;

    const MIN_RATE = 0.5;
    const MAX_RATE = 5.0;
    const SPEED_FOR_MAX = 12.0; // px/ms needed to hit MAX_RATE (less reactive)
    const TARGET_RATE = 1.0;
    const VIDEO_BASE_FPS = 12;
    const ESC_GUARD_MS = 300;
    const SNAP_RANGE = 0.18; // snap window around 1.0x
    const SNAP_STRENGTH = 0.45; // 0..1 blend toward target
    const STOP_DELAY_MS = 200;
    const PIXELS_PER_FRAME = 40; // larger = more scroll required per frame

    let ctx = null;
    let buffer = null;
    let reverseBuffer = null;
    let source = null;
    let gain = null;
    let unlocked = false;
    let clickCtx = null;
    let clickBuffer = null;
    let clickGain = null;
    let lastClickAt = 0;
    const CLICK_GAIN = 0.03;
    const CLICK_MIN_INTERVAL = 300;
    let playhead = 0;
    let lastTick = performance.now();
    let targetRate = MIN_RATE;
    let playMode = "scroll"; // "scroll" or "original"

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function mapSpeedToRate(speed) {
      // speed is px/ms; map 0..SPEED_FOR_MAX to MIN..MAX
      const normalized = clamp(speed / SPEED_FOR_MAX, 0, 1);
      return MIN_RATE + normalized * (MAX_RATE - MIN_RATE);
    }

    function frameSrc(index) {
      const clamped = clamp(index, 0, displayFrames - 1);
      const mapped = activeMode === "video" ? (clamped * 2) % totalFrames : clamped;
      const padded = String(mapped + 1).padStart(FRAME_PAD, "0");
      return `${currentVideoDir}/${FRAME_PREFIX}${padded}.${FRAME_EXT}`;
    }

    function setFrame(index) {
      const clamped = clamp(index, 0, displayFrames - 1);
      if (clamped === currentFrame) return;
      const src = frameSrc(clamped);
      frameEl.src = src;
      currentFrame = clamped;
    }

    function trackUrl(file) {
      return `${TRACK_DIR}/${encodeURIComponent(file)}`;
    }

    function setBgColor(color) {
      const value = color || "#000";
      document.documentElement.style.setProperty("--bg", value);
      document.body.style.background = value;
      if (bgEl) {
        bgEl.style.background = value;
      }
    }

    function setAudioGradient(color, progress) {
      if (!audioGradientEl) return;
      audioGradProgress = Math.max(0, Math.min(progress, 1));
      const width = `${audioGradProgress * 100}%`;
      audioGradientEl.style.setProperty("--audio-grad-color", color || "transparent");
      audioGradientEl.style.setProperty("--audio-grad-width", width);
    }

    function updateDistanceCounter() {
      const inches = totalDistancePx * IN_PER_PX;
      const meters = inches * M_PER_IN;
      if (distanceEl) {
        distanceEl.textContent = `i sat through ${Math.round(totalDistancePx)}px, ${Math.round(inches)}in and ${Math.round(meters)}m`;
      }
    }

    function updateSpeedUi() {
      if (!speedThumb || !speedRange) return;
      const min = parseFloat(speedRange.min);
      const max = parseFloat(speedRange.max);
      const pct = (speedMultiplier - min) / (max - min);
      speedThumb.style.left = `${Math.max(0, Math.min(pct, 1)) * 100}%`;
    }

    function ensureContext() {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        gain = ctx.createGain();
        gain.gain.value = 1;
        gain.connect(ctx.destination);
      }
      if (ctx.state === "suspended") {
        ctx.resume();
      }
    }

    async function ensureClickContext() {
      if (!clickCtx) {
        clickCtx = new (window.AudioContext || window.webkitAudioContext)();
        clickGain = clickCtx.createGain();
        clickGain.gain.value = CLICK_GAIN;
        clickGain.connect(clickCtx.destination);
      }
      if (clickCtx.state === "suspended") {
        await clickCtx.resume();
      }
      if (clickBuffer) return;
      const res = await fetch(CLICK_URL);
      const arr = await res.arrayBuffer();
      clickBuffer = await clickCtx.decodeAudioData(arr);
    }

    async function playClick() {
      const now = performance.now();
      if (now - lastClickAt < CLICK_MIN_INTERVAL) return;
      lastClickAt = now;
      try {
        await ensureClickContext();
        if (!clickBuffer) return;
        const clickSource = clickCtx.createBufferSource();
        clickSource.buffer = clickBuffer;
        clickSource.connect(clickGain);
        clickSource.start(0);
      } catch (err) {
        // ignore click audio errors
      }
    }

    function unlockClickAudio() {
      ensureClickContext();
    }

    function createReversedBuffer(src) {
      const rev = ctx.createBuffer(src.numberOfChannels, src.length, src.sampleRate);
      for (let ch = 0; ch < src.numberOfChannels; ch++) {
        const srcData = src.getChannelData(ch);
        const revData = rev.getChannelData(ch);
        for (let i = 0, j = srcData.length - 1; i < srcData.length; i++, j--) {
          revData[i] = srcData[j];
        }
      }
      return rev;
    }

    async function loadAudio() {
      const url = trackUrl(currentTrack);
      if (buffer && lastAudioUrl === url) return;
      lastAudioUrl = url;
      const res = await fetch(url);
      const arr = await res.arrayBuffer();
      buffer = await ctx.decodeAudioData(arr);
      reverseBuffer = createReversedBuffer(buffer);
    }

    function startSource() {
      if (!buffer || !reverseBuffer) return;
      if (source) {
        source.stop();
        source.disconnect();
      }
      source = ctx.createBufferSource();
      source.buffer = direction === 1 ? buffer : reverseBuffer;
      source.loop = true;
      source.playbackRate.value = Math.max(targetRate, 0.01);
      source.connect(gain);
      const dur = buffer.duration;
      const mod = ((playhead % dur) + dur) % dur;
      const offset = direction === 1 ? mod : (dur - mod);
      source.start(0, offset);
    }

    function stopSource() {
      if (source) {
        source.stop();
        source.disconnect();
        source = null;
      }
    }

    async function unlockAudio() {
      ensureContext();
      if (!unlocked) {
        unlocked = true;
      }
      if (!buffer) {
        await loadAudio();
      }
    }

    function processDelta(deltaY, now, y, maxScroll) {
      const scaledDelta = deltaY * speedMultiplier;
      if (deltaY !== 0) {
        totalDistancePx += Math.abs(deltaY);
        updateDistanceCounter();
      }
      if (!isActive) return;
      if (scaledDelta === 0) return;
      const dt = Math.max(now - lastT, 1);
      const speed = Math.abs(scaledDelta) / dt; // px/ms

      // Exponential smoothing to reduce jitter
      smoothedSpeed = smoothedSpeed * 0.96 + speed * 0.04;

      direction = scaledDelta > 0 ? 1 : -1;

      let rate = mapSpeedToRate(smoothedSpeed);
      if (Math.abs(rate - TARGET_RATE) < SNAP_RANGE) {
        rate = rate * (1 - SNAP_STRENGTH) + TARGET_RATE * SNAP_STRENGTH;
      }
      if (playMode === "scroll") {
        targetRate = rate;
        speedEl.textContent = (direction * targetRate).toFixed(2);
      } else {
        speedEl.textContent = "1.00";
      }

      if (activeMode === "track") {
        if (!unlocked) {
          unlockAudio().then(() => {
            if (!source) startSource();
          });
        } else if (buffer && !source) {
          startSource();
        }
      }

      // Advance frames only on input (scrub by distance scrolled)
      const span = displayFrames * PIXELS_PER_FRAME;
      totalScroll = (totalScroll + scaledDelta) % span;
      if (totalScroll < 0) totalScroll += span;
      frameHead = totalScroll / PIXELS_PER_FRAME;
      setFrame(Math.round(frameHead));
      if (document.body.classList.contains("has-gradient")) {
        const progress = span > 0 ? totalScroll / span : 0;
        setAudioGradient(nextTrackColor, progress);
      }


      lastT = now;
      lastScrollTime = now;
    }

    window.addEventListener("scroll", () => {
      playClick();
      const now = performance.now();
      const y = window.scrollY;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const deltaY = y - lastY;
      processDelta(deltaY, now, y, maxScroll);
      lastY = y;
    }, { passive: true });

    window.addEventListener("wheel", (e) => {
      playClick();
      const now = performance.now();
      const y = window.scrollY;
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (e.deltaY !== 0) {
        processDelta(e.deltaY, now, y, maxScroll);
      }
    }, { passive: true });

    function maybeUnlockAudio() {
      if (activeMode !== "track") return;
      unlockAudio();
    }

    window.addEventListener("pointerdown", maybeUnlockAudio, { passive: true });
    window.addEventListener("touchstart", maybeUnlockAudio, { passive: true });
    window.addEventListener("wheel", maybeUnlockAudio, { passive: true });
    window.addEventListener("keydown", maybeUnlockAudio, { passive: true });
    window.addEventListener("pointerdown", unlockClickAudio, { passive: true });
    window.addEventListener("touchstart", unlockClickAudio, { passive: true });
    window.addEventListener("keydown", unlockClickAudio, { passive: true });
    window.addEventListener("wheel", unlockClickAudio, { passive: true });
    window.addEventListener("touchmove", unlockClickAudio, { passive: true });
    window.addEventListener("scroll", unlockClickAudio, { passive: true });

    function tick() {
      const now = performance.now();
      const dt = (now - lastTick) / 1000;
      lastTick = now;

      if (isActive && activeMode === "track" && playMode === "original") {
        const next = (audioGradProgress + dt * 0.08) % 1;
        setAudioGradient(nextTrackColor, next);
      }

      if (isActive && activeMode === "video" && playMode === "original") {
        frameHead = (frameHead + VIDEO_BASE_FPS * dt) % displayFrames;
        setFrame(Math.round(frameHead));
        speedEl.textContent = "1.00";
        requestAnimationFrame(tick);
        return;
      }

      if (isActive && unlocked && buffer) {
        if (playMode === "original") {
          if (!source) startSource();
          if (source) {
            source.playbackRate.setValueAtTime(1.0, ctx.currentTime);
          }
          playhead += dt;
          speedEl.textContent = "1.00";
          requestAnimationFrame(tick);
          return;
        }

        if (now - lastScrollTime > STOP_DELAY_MS) {
          stopSource();
          speedEl.textContent = "0.00";
          targetRate = MIN_RATE;
          if (document.body.classList.contains("has-gradient") && audioGradProgress > 0) {
            setAudioGradient(nextTrackColor, audioGradProgress * 0.92);
          }
          requestAnimationFrame(tick);
          return;
        }

        const desiredBuffer = direction === 1 ? buffer : reverseBuffer;
        const dirChanged = source && source.buffer !== desiredBuffer;
        if (!source || dirChanged) {
          startSource();
        }
        if (source) {
          source.playbackRate.setValueAtTime(Math.max(targetRate, 0.01), ctx.currentTime);
        }
        if (buffer) {
          playhead += direction * targetRate * dt;
        }
      }

      requestAnimationFrame(tick);
    }

    function setScrollSpaceHeight() {
      const height = window.innerHeight + displayFrames * PIXELS_PER_FRAME;
      scrollSpace.style.height = `${Math.max(height, window.innerHeight * 2)}px`;
      document.body.style.minHeight = scrollSpace.style.height;
    }

    window.addEventListener("resize", setScrollSpaceHeight);
    setScrollSpaceHeight();
    frameEl.addEventListener("load", () => {
      lastGoodSrc = frameEl.src;
    });
    frameEl.addEventListener("error", () => {
      if (lastGoodSrc) frameEl.src = lastGoodSrc;
    });
    tick();

    function setAudioUiVisible() {
      // no-op: legacy controls removed
    }

    function activateContent(item) {
      isActive = true;
      document.body.classList.add("is-active");
      document.body.style.overflowY = "scroll";
      startScreen.style.display = "none";
      playMode = "scroll";
      targetRate = MIN_RATE;
      smoothedSpeed = 0;
      speedEl.textContent = "0.00";
      totalScroll = 0;
      frameHead = 0;
      direction = 1;
      lastT = performance.now();
      lastScrollTime = lastT;
      lastY = window.scrollY;
      displayFrames = activeMode === "video" ? Math.ceil(totalFrames / 2) : totalFrames;

      activeMode = item.type;
      if (item.type === "video") {
        document.body.classList.remove("is-audio");
        document.body.classList.add("is-video");
        if (item.id === "bw-dancer") {
          document.body.classList.add("video-right");
          document.body.classList.remove("video-left");
        } else {
          document.body.classList.add("video-left");
          document.body.classList.remove("video-right");
        }
        modeLabel.textContent = item.label.toLowerCase();
        stopSource();
        buffer = null;
        reverseBuffer = null;
        currentVideoDir = item.source.dir;
        totalFrames = item.source.frames;
        displayFrames = Math.ceil(totalFrames / 2);
        setBgColor("#0b0905");
        if (item.id === "bw-dancer") {
          document.body.classList.add("has-gradient");
          nextTrackColor = TRACK_COLORS[TRACKS[0].label];
          setAudioGradient(nextTrackColor, 0);
        } else {
          document.body.classList.remove("has-gradient");
          nextTrackColor = "transparent";
          setAudioGradient("transparent", 0);
        }
      } else {
        document.body.classList.add("is-audio");
        document.body.classList.remove("is-video");
        document.body.classList.add("has-gradient");
        document.body.classList.remove("video-left");
        document.body.classList.remove("video-right");
        currentVideoDir = VIDEO_SOURCES.default.dir;
        totalFrames = VIDEO_SOURCES.default.frames;
        displayFrames = totalFrames;
        currentTrack = item.file;
        modeLabel.textContent = item.label.toLowerCase();
        setBgColor(item.color);
        const idx = TRACKS.findIndex((track) => track.file === item.file);
        if (idx >= 0 && idx < TRACKS.length - 1) {
          nextTrackColor = TRACK_COLORS[TRACKS[idx + 1].label];
        } else if (idx === TRACKS.length - 1) {
          nextTrackColor = "#0b0905";
        } else {
          nextTrackColor = TRACK_COLORS[TRACKS[0].label];
        }
        setAudioGradient(nextTrackColor, 0);
      }

      currentFrame = -1;
      lastGoodSrc = "";
      setFrame(0);
      setScrollSpaceHeight();
      window.scrollTo({ top: 0, behavior: "auto" });
      if (item.type === "track") {
        unlockAudio().then(() => {
          if (!source) startSource();
        });
      }
    }

    function resetToMenu() {
      isActive = false;
      activeMode = "none";
      document.body.classList.remove("is-active");
      document.body.classList.remove("is-audio");
      document.body.classList.remove("is-video");
      document.body.classList.remove("has-gradient");
      document.body.classList.remove("video-left");
      document.body.classList.remove("video-right");
      document.body.style.overflowY = "hidden";
      startScreen.style.display = "grid";
      setAudioUiVisible(false);
      modeLabel.textContent = "";
      stopSource();
      buffer = null;
      reverseBuffer = null;
      speedEl.textContent = "0.00";
      playMode = "scroll";
      targetRate = MIN_RATE;
      smoothedSpeed = 0;
      setBgColor("#000");
      nextTrackColor = "transparent";
      setAudioGradient("transparent", 0);
      window.scrollTo({ top: 0, behavior: "auto" });
      applySelection();
    }

    const startButtons = [];
    let selectedIndex = 0;

    function applySelection() {
      startButtons.forEach((btn, idx) => {
        btn.classList.toggle("is-selected", idx === selectedIndex);
      });
    }

    CONTENT.forEach((item) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "start-item";
      button.textContent = item.label.toLowerCase();
      if (item.color) {
        button.style.setProperty("--item-color", item.color);
      }
      if (item.preview) {
        button.style.setProperty("--item-bg-image", `url("${item.preview}")`);
      }
      startPanel.appendChild(button);
      startButtons.push(button);
    });

    applySelection();

    document.body.style.overflowY = "hidden";
    setAudioUiVisible(false);

    let menuScrollAccum = 0;
    const MENU_SCROLL_STEP = 120;
    window.addEventListener("wheel", (e) => {
      if (isActive) return;
      e.preventDefault();
      if (!startButtons.length) return;
      menuScrollAccum += e.deltaY;
      while (menuScrollAccum >= MENU_SCROLL_STEP) {
        selectedIndex = (selectedIndex + 1) % startButtons.length;
        menuScrollAccum -= MENU_SCROLL_STEP;
      }
      while (menuScrollAccum <= -MENU_SCROLL_STEP) {
        selectedIndex = (selectedIndex - 1 + startButtons.length) % startButtons.length;
        menuScrollAccum += MENU_SCROLL_STEP;
      }
      applySelection();
    }, { passive: false });

    window.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "v") {
        document.body.classList.toggle("show-speed-toggle");
        if (speedToggle) {
          speedToggle.setAttribute("aria-hidden", document.body.classList.contains("show-speed-toggle") ? "false" : "true");
        }
        return;
      }
      if (e.key.toLowerCase() === "x") {
        resetToMenu();
        return;
      }
      if (e.key.toLowerCase() === "o") {
        if (!isActive) return;
        if (playMode === "scroll") {
          playMode = "original";
          direction = 1;
          targetRate = 1.0;
          speedEl.textContent = "1.00";
        } else {
          playMode = "scroll";
        }
        return;
      }
      if (!isActive && (e.key === "Enter" || e.key === " ")) {
        e.preventDefault();
        const item = CONTENT[selectedIndex];
        if (item) activateContent(item);
      }
    });

    window.addEventListener("pointermove", playClick, { passive: true });
    window.addEventListener("mousemove", playClick, { passive: true });
    window.addEventListener("touchmove", playClick, { passive: true });
    window.addEventListener("pointerdown", playClick, { passive: true });
    window.addEventListener("touchstart", playClick, { passive: true });

    if (speedRange) {
      speedRange.addEventListener("input", () => {
        speedMultiplier = parseFloat(speedRange.value);
        updateSpeedUi();
      });
      updateSpeedUi();
    }
  </script>
</body>
</html>
